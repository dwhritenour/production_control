components:
- components:
  - components:
    - event_bindings: {}
      layout_properties: {}
      name: btn_scan
      properties:
        align: left
        icon: fa:search
        role: elevated-button
        spacing:
          padding: [null, '15', null, '15']
        text: Scan Work Orders
      type: Button
    - event_bindings: {}
      layout_properties: {}
      name: btn_refresh
      properties:
        align: right
        icon: fa:refresh
        role: elevated-button
        spacing:
          padding: [null, '15', null, '15']
        text: Refresh Work Orders
      type: Button
    - layout_properties: {}
      name: btn_ack_orphans
      properties:
        align: right
        foreground: '#FF9800'
        icon: fa:check-square-o
        role: elevated-button
        spacing:
          padding: [null, '15', null, '15']
        text: Accept Orphans
      type: Button
    - layout_properties: {}
      name: lbl_last_refreshed
      properties: {align: left, font_size: 10, foreground: '#888888', icon: 'fa:refresh', italic: true, text: 'Last Refreshed: -- '}
      type: Label
    - layout_properties: {}
      name: btn_sms_test
      properties: {role: elevated-button, text: SMS Test}
      type: Button
    layout_properties: {full_width_row: true, grid_position: 'OISICE,JEPZLC'}
    name: flow_buttons
    properties:
      spacing:
        margin: ['0', null, '0', null]
    type: FlowPanel
  - components:
    - data_bindings: []
      event_bindings: {}
      layout_properties: {width: 183.5}
      name: dd_status_filter
      properties:
        include_placeholder: true
        items: [All, Created, Released, In Progress, Shipped - Verify, Invoiced - Verify, Closed - Verify, Complete, Pending Changes]
        placeholder: Filter by Status
      type: DropDown
    - event_bindings: {}
      layout_properties: {width: 217}
      name: dd_sort
      properties:
        include_placeholder: true
        items: [Created Date (Newest), Due Date (Earliest), SO# (Ascending), 'WO# (Ascending) ', Part# (Ascending)]
        margin: [null, null, '4', null]
        placeholder: 'Sort Ascending by:'
      type: DropDown
    - data_bindings: []
      event_bindings: {}
      layout_properties: {width: 245}
      name: tb_search
      properties:
        margin: [null, null, '4', null]
        placeholder: Search by SO#, Part#, or WO#
      type: TextBox
    - layout_properties: {}
      name: btn_clear_filters
      properties:
        align: right
        icon: fa:times
        role: elevated-button
        spacing:
          padding: [null, '15', null, '15']
        text: Clear Filters
      type: Button
    - event_bindings: {}
      layout_properties: {}
      name: cb_active_only
      properties: {text: Active Word Orders Only}
      type: CheckBox
    - event_bindings: {}
      layout_properties: {}
      name: cb_backorder_only
      properties: {text: Backorders Only}
      type: CheckBox
    layout_properties: {full_width_row: true, grid_position: 'CENMEQ,IELMLJ'}
    name: flow_filters
    properties: {}
    type: FlowPanel
  - components:
    - layout_properties: {}
      name: lbl_created_count
      properties:
        bold: true
        border: '1px solid #2196F3'
        foreground: '#2196F3'
        role: null
        spacing:
          padding: [null, '4', null, '4']
        text: 'Created: 0'
      type: Link
    - components: []
      layout_properties: {}
      name: lbl_in_progress_count
      properties:
        bold: true
        border: '1px solid #FF9800'
        foreground: '#FF9800'
        role: null
        spacing:
          padding: [null, '4', null, '4']
        text: 'In Progress: 0'
      type: Link
    - components: []
      layout_properties: {}
      name: lbl_complete_count
      properties:
        bold: true
        border: '1px solid #C62828'
        foreground: '#C62828'
        role: null
        spacing:
          padding: [null, '4', null, '4']
        text: 'Complete: 0'
      type: Link
    - components: []
      layout_properties: {}
      name: lbl_changes_count
      properties:
        bold: true
        border: '1px solid #607D8B'
        foreground: '#607D8B'
        role: null
        spacing:
          padding: [null, '4', null, '4']
        text: 'Changes: 0'
      type: Link
    - components: []
      layout_properties: {}
      name: lk_plan_count
      properties:
        bold: true
        border: '1px solid #2cb0eb'
        foreground: '#2cb0eb'
        role: null
        spacing:
          padding: [null, '4', null, '4']
        text: 'Plan: 0'
      type: Link
    - layout_properties: {}
      name: lbl_record_count
      properties: {align: right, font_size: 12, foreground: '#888888', icon: 'fa:arrow-right', text: 0 work orders}
      type: Label
    layout_properties: {full_width_row: true, grid_position: 'ITLILM,NODMUV'}
    name: flow_summary
    properties:
      spacing:
        margin: ['0', null, null, null]
        padding: ['0', null, null, null]
    type: FlowPanel
  - components:
    - layout_properties: {}
      name: repeating_panel_1
      properties:
        item_template: work_orders.WorkOrdersRowTemplate
        margin: ['0', null, null, null]
      type: RepeatingPanel
    - layout_properties: {slot: footer}
      name: grid_pager_1
      properties: {}
      type: Transfer_Dashboard.grid_pager
    data_bindings: []
    layout_properties: {full_width_row: true, grid_position: 'TRVFKH,LFNVUC'}
    name: grid_work_orders
    properties:
      columns:
      - {data_key: '', expand: false, id: JKSDUP, title: WO#, width: '200'}
      - {data_key: '', id: OJLQEN, title: SO# / Rel# / Item#, width: '160'}
      - {data_key: '', id: NEORKT, title: Quick Release, width: '180'}
      - {data_key: column_1, id: OVZFKY, title: Plan, width: '100'}
      - {data_key: '', expand: false, id: VJQQOR, title: Status, width: '200'}
      - {data_key: column_1, id: TQXVKL, title: Routing, width: '100'}
      - {data_key: '', id: NTNWAU, title: Part# / Description, width: '220'}
      - {data_key: '', id: SVQOSD, title: Material / SE, width: '160'}
      - {data_key: quantity, expand: false, id: CFDXLR, title: Qty, width: 97.5}
      - {data_key: '', id: EXQTUZ, title: Override Qty, width: '150'}
      - {data_key: '', id: PBWTKO, title: WO Due Date, width: '150'}
      - {data_key: '', id: SVOJTH, title: SO Due Date, width: '200'}
      - {data_key: created_at, id: ZWLYFT, title: Created, width: '200'}
      - {data_key: '', expand: true, id: BDHJXT, title: Notes, width: '350'}
      margin: [null, '0', null, '0']
      role: [horizontal-scroll, tonal-data-grid]
      rows_per_page: 15
      show_page_controls: false
    type: DataGrid
  layout_properties: {slot: default}
  name: content_panel
  properties: {col_widths: '{}'}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- layout_properties: {slot: title}
  name: lbl_title
  properties:
    bold: true
    font_size: null
    role: title
    spacing:
      margin: ['5', null, null, null]
      padding: ['8', null, null, null]
    text: Production Control v2.0
  type: Label
- layout_properties: {slot: left-nav}
  name: nav
  properties: {}
  type: form:NavSidebar
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
