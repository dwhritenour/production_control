<anvil-form container="ColumnPanel">
  <anvil-component type="ColumnPanel" name="cp_page_root">

    <!-- Header: search row -->
    <anvil-component type="FlowPanel" name="fp_search" prop:vertical_align="center">
      <anvil-component type="TextBox" name="tb_sku_search" prop:placeholder="Search SKU or description…" container:width="320"></anvil-component>
      <anvil-component type="DropDown" name="dd_sku_results" container:width="420"></anvil-component>
      <anvil-component type="Button" name="btn_new_sku" prop:text="+ New SKU" prop:role="outlined-button"></anvil-component>
    </anvil-component>

    <anvil-component type="Label" name="lbl_wo_banner" prop:visible="false"></anvil-component>
    <anvil-component type="Label" name="lbl_sku_title" prop:role="headline" prop:bold="true"></anvil-component>

    <anvil-component type="FlowPanel" name="fp_sku_line" prop:vertical_align="center">
      <anvil-component type="Label" name="lbl_part_desc"></anvil-component>
      <anvil-component type="Label" name="lbl_sku_source"></anvil-component>
      <anvil-component type="Link" name="lk_view_notes" prop:text="View Notes" prop:visible="false"></anvil-component>
    </anvil-component>

    <!-- Body: two columns side by side -->
    <anvil-component type="GridPanel" name="gp_body">

      <anvil-component type="ColumnPanel" name="cp_routing_col" container:row="body_row" container:col_xs="0" container:width_xs="7">
        <anvil-component type="Label" name="lbl_routing_cap" prop:text="Routing" prop:bold="true"></anvil-component>
        <anvil-component type="RepeatingPanel" name="rp_steps" prop:item_template="Transfer_Dashboard.RoutingStepRow2"></anvil-component>
        <anvil-component type="Button" name="btn_add_step" prop:text="+ Add Step" prop:role="outlined-button"></anvil-component>
      </anvil-component>

      <anvil-component type="ColumnPanel" name="cp_diagram_col" container:row="body_row" container:col_xs="7" container:width_xs="5">
        <anvil-component type="Label" name="lbl_diagram_cap" prop:text="Diagram" prop:bold="true"></anvil-component>
        <anvil-component type="HtmlComponent" name="html_diagram" prop:style="height: 500px; min-height: 500px;"></anvil-component>
      </anvil-component>

    </anvil-component>

    <!-- Actions -->
    <anvil-component type="FlowPanel" name="fp_actions" prop:align="right">
      <anvil-component type="Button" name="btn_save_template" prop:text="Save as Default Routing" prop:role="outlined-button"></anvil-component>
      <anvil-component type="Button" name="btn_save_release" prop:text="Save Routing &amp; Release" prop:role="filled-button" prop:visible="false"></anvil-component>
      <anvil-component type="Button" name="btn_cancel_wo" prop:text="Cancel Release" prop:role="outlined-button" prop:visible="false"></anvil-component>
    </anvil-component>

  </anvil-component>
</anvil-form>
