        visible: false
      type: Label
    - layout_properties: {grid_position: 'YZPVTT,UKYHUI UDSNYU,PSNQXC'}
      name: lbl_sku_running_pct
      properties:
        spacing:
          margin: ['0', null, '0', null]
          padding: ['0', null, '0', null]
