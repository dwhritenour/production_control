    layout_properties: {grid_position: 'NSLYME,XGFQHZ'}
    name: panel_sku_browser
    properties: {col_widths: '{"KMVMVN":10,"DJDKPW":25,"WVRMJU":25}', role: outlined-card}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
