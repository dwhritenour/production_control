      type: Label
    - layout_properties: {grid_position: 'YZPVTT,BXBIEB FTICGU,KVTCDN'}
      name: lbl_sku_cv
      properties:
        spacing:
          margin: ['0', null, '0', null]
          padding: ['0', null, '0', null]
