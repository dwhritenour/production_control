components:
- components:
  - components:
    - layout_properties: {grid_position: 'GYEQHO,VUGHRJ'}
      name: label_6
      properties: {bold: true, text: Select Batch Number, underline: true}
      type: Label
    - layout_properties: {grid_position: 'GYEQHO,FANYRG'}
      name: lbl_status
      properties: {align: right}
      type: Label
    - event_bindings: {}
      layout_properties: {grid_position: 'NQVUCV,OHFLOT'}
      name: dd_batch
      properties: {include_placeholder: true, placeholder: Select Batch, tooltip: Select a Batch.}
      type: DropDown
    - event_bindings: {}
      layout_properties: {grid_position: 'NQVUCV,HEGTVU'}
      name: btn_run_optimizer
      properties:
        align: right
        role: elevated-button
        spacing:
          padding: [null, '12', null, '12']
        text: Optimizer
        tooltip: Run Batch Optimizer.
      type: Button
    - event_bindings: {}
      layout_properties: {grid_position: 'NQVUCV,QRPQYP'}
      name: btn_consolidate
      properties:
        align: center
        role: elevated-button
        spacing:
          margin: [null, null, null, null]
          padding: [null, '12', null, '12']
        text: Consolidate
        tooltip: Consolidate all batches into one Batch.
      type: Button
    - event_bindings: {}
      layout_properties: {grid_position: 'NQVUCV,PYTUJT'}
      name: btn_refresh
      properties:
        align: center
        role: elevated-button
        spacing:
          padding: [null, '12', null, '12']
        text: Refresh Batch
        tooltip: Refresh current batch.
      type: Button
    - layout_properties: {grid_position: 'NQVUCV,TTPDUN'}
      name: btn_clear_zero_stock
      properties: {icon: '', role: elevated-button, text: Clear Zero Stock, tooltip: 'Cancel optimizer-queue recommendations that have zero Hub stock available. '}
      type: Button
    layout_properties: {grid_position: 'CMUOWA,EUQNFU'}
    name: outlined_card_2
    properties: {col_widths: '{"OHFLOT":30,"HEGTVU":10,"PYTUJT":15,"QRPQYP":15,"TTPDUN":17}', role: outlined-card}
    type: ColumnPanel
  - components: []
    layout_properties: {grid_position: 'SJIGWD,JFMZQK'}
    name: gp_header
    properties: {}
    type: GridPanel
  - components:
    - layout_properties: {grid_position: 'HVNLSC,KPJTUI'}
      name: lbl_batch_header
      properties:
        bold: true
        spacing:
          margin: ['0', null, '0', null]
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {grid_position: 'OXSVTL,EAZRJO'}
      name: lbl_detail_title
      properties: {bold: true, text: Transfer Assignments}
      type: Label
    - data_bindings: []
      layout_properties: {grid_position: 'OXSVTL,PUQJIO'}
      name: dd_sort
      properties:
        align: full
        include_placeholder: true
        items: [SKU, Priority, 'Trip #']
        placeholder: 'Sort By: (SKU Default)'
        tooltip: Sort Trip Assignments.
      type: DropDown
    - layout_properties: {grid_position: 'OXSVTL,WEFZBB'}
      name: cb_select_all
      properties: {text: Select All SKUs, tooltip: Selects all SKUS.}
      type: CheckBox
    - components:
      - data_bindings: []
        name: rp_items
        properties: {item_template: trip_editor.RowTemplate2}
        type: RepeatingPanel
      layout_properties: {grid_position: 'GRCWTB,SCYFBM'}
      name: dg_items
      properties:
        columns:
        - {data_key: SEL, id: ANWTDA, title: ✓, width: '50'}
        - {data_key: SKU, expand: false, id: JKSDUP, title: SKU, width: '120'}
        - {data_key: LOC, expand: false, id: VJQQOR, title: Location, width: '90'}
        - {data_key: HUBOH, expand: false, id: OJLQEN, title: Hub OH, width: '100'}
        - {data_key: QTY, expand: false, id: VEMYWS, title: Qty, width: '85'}
        - {data_key: PRIOR, expand: false, id: SUZTHF, title: Priority, width: '120'}
        - {data_key: TRPDTE, expand: false, id: QLDJBC, title: Trip Date, width: 165}
        - {data_key: TRPTME, expand: false, id: ABVFVE, title: Trip Time, width: '100'}
        - {data_key: TRPNUM, expand: false, id: KYITXR, title: 'Trip #', width: '80'}
        role: [tonal-data-grid, horizontal-scroll]
      type: DataGrid
    layout_properties: {grid_position: 'DVAOZP,CVQNIA'}
    name: cp_detail
    properties: {col_widths: '{"EAZRJO":45,"PUQJIO":25,"WEFZBB":20}', role: outlined-card}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'OJGAIX,NNISOQ'}
      name: lbl_summary_title
      properties: {bold: true, text: Trip Summary (Capacity Check)}
      type: Label
    - components:
      - layout_properties: {}
        name: rp_summary
        properties: {item_template: trip_editor.SummaryRowTemplate}
        type: RepeatingPanel
      layout_properties: {grid_position: 'QXHTZH,MJAWLP'}
      name: dg_summary
      properties:
        columns:
        - {data_key: TRPDTE, expand: false, id: JKSDUP, title: Trip Date, width: '130'}
        - {data_key: TRPNUM, id: VJQQOR, title: 'Trip #', width: '130'}
        - {data_key: SKUCNT, id: OJLQEN, title: SKU, width: '150'}
        - {data_key: VOLUME, id: CUKNTU, title: Volume (ft3), width: '130'}
        - {data_key: WEIGHT, id: BGZUCU, title: Weight (lb), width: '130'}
        - {data_key: VOLPCT, id: WVCBYK, title: Vol %, width: '130'}
        - {data_key: WTPCT, id: KAMPYF, title: Wt %, width: '130'}
        role: tonal-data-grid
      type: DataGrid
    layout_properties: {grid_position: 'VXJVEQ,QQNPCD'}
    name: cp_summary
    properties: {role: outlined-card}
    type: ColumnPanel
  - components:
    - event_bindings: {}
      layout_properties: {grid_position: 'FCJMNN,FGFKLB'}
      name: dp_date_pdf
      properties: {}
      type: DatePicker
    - event_bindings: {}
      layout_properties: {grid_position: 'FCJMNN,AQHCPL'}
      name: dd_batch_pdf
      properties: {}
      type: DropDown
    - event_bindings: {}
      layout_properties: {grid_position: 'COZJHR,WJWNRE'}
      name: btn_trip_pdf
      properties: {align: left, role: elevated-button, text: Create PDF(s)}
      type: Button
    - event_bindings: {}
      layout_properties: {grid_position: 'COZJHR,LARGFS'}
      name: btn_cancel_batch
      properties: {align: right, role: elevated-button, text: Delete Batch}
      type: Button
    - layout_properties: {grid_position: 'COZJHR,KDBXUL'}
      name: lbl_carve_date
      properties: {align: right, bold: true, text: 'Carve Date:'}
      type: Label
    - layout_properties: {grid_position: 'COZJHR,XVGTTB'}
      name: dp_carve_date
      properties: {align: right, placeholder: Carve Date}
      type: DatePicker
    - event_bindings: {}
      layout_properties: {grid_position: 'COZJHR,AVJSNK'}
      name: btn_finalize
      properties: {align: right, role: elevated-button, text: Finalize Trips}
      type: Button
    layout_properties: {grid_position: 'GLSGGF,SUBRZL'}
    name: outlined_card_3
    properties: {col_widths: '{"FGFKLB":20,"AQHCPL":27,"WJWNRE":15,"AVJSNK":12,"XVGTTB":20,"KDBXUL":10}', role: outlined-card}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {tooltip: ''}
  type: ColumnPanel
- components: []
  layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- layout_properties: {slot: title}
  name: lbl_title
  properties: {role: title, text: Transfer Trip Editor}
  type: Label
- layout_properties: {slot: left-nav}
  name: nav
  properties: {}
  type: form:NavSidebar
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
