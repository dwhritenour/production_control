components:
- components:
  - components:
    - layout_properties: {grid_position: 'ZRBUAE,LLQXSL'}
      name: lbl_title
      properties: {align: left, bold: true, font_size: 22, icon: 'fa:search', text: SKU Forecast Detail}
      type: Label
    - layout_properties: {grid_position: 'ZRBUAE,YVQQOC'}
      name: btn_refresh
      properties: {align: right, bold: false, icon: 'fa:refresh', role: elevated-button, text: Refresh}
      type: Button
    layout_properties: {grid_position: 'IJGPWP,KAMTOP'}
    name: oc_header
    properties: {col_widths: '{"LLQXSL":20,"YVQQOC":15}', role: outlined-card}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'OMPVVY,RAFRSQ'}
      name: lbl_search
      properties: {bold: true, text: 'Search:'}
      type: Label
    - layout_properties: {grid_position: 'OMPVVY,GVFMLL'}
      name: tb_sku_search
      properties:
        font_size: 14
        margin: ['0', null, '0', null]
        placeholder: Type SKU or part of it, press Enter
      type: TextBox
    - layout_properties: {grid_position: 'OMPVVY,KPNJSL'}
      name: dd_sku_results
      properties:
        margin: ['0', null, '0', null]
      type: DropDown
    - layout_properties: {grid_position: 'OMPVVY,DEUGSF'}
      name: lbl_batch
      properties: {align: right, bold: true, text: 'Batch:'}
      type: Label
    - layout_properties: {grid_position: 'OMPVVY,KYKSCJ'}
      name: dd_batch
      properties:
        margin: ['0', null, '0', null]
      type: DropDown
    layout_properties: {grid_position: 'RYCUGI,LXQKEC'}
    name: oc_search
    properties: {col_widths: '{"RAFRSQ":5,"GVFMLL":20,"KPNJSL":15,"DEUGSF":5,"KYKSCJ":15}', role: outlined-card}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'YDYOXV,DNVTRP SYDWZP,KLWBCE OALENF,XMQSDG'}
      name: lbl_sku
      properties:
        bold: true
        font_size: 16
        spacing:
          padding: ['0', null, '0', null]
        text: Select a SKU above
      type: Label
    - layout_properties: {grid_position: 'YDYOXV,DNVTRP SYDWZP,KLWBCE HZYDGH,SZCLMT'}
      name: lbl_series
      properties:
        font_size: 16
        spacing:
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {grid_position: 'YDYOXV,DNVTRP SYDWZP,FKQVVU MESQYB,SQPNZK'}
      name: lbl_description
      properties:
        font_size: 16
        spacing:
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {grid_position: 'YDYOXV,DNVTRP SYDWZP,FKQVVU XVEGAL,WQUZDS'}
      name: lbl_model_used
      properties:
        font_size: 16
        spacing:
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {grid_position: 'YDYOXV,HCAMCK SYAPLC,UCGIFI'}
      name: lbl_classification
      properties:
        font_size: 16
        spacing:
          padding: ['0', null, '0', null]
      type: Label
    - layout_properties: {grid_position: 'YDYOXV,HCAMCK EVCKJI,SPAFNM'}
      name: lbl_history_months
      properties:
        font_size: 16
        spacing:
          padding: ['0', null, '0', null]
      type: Label
    layout_properties: {grid_position: 'BTNGGD,XPPKBS'}
    name: oc_info
    properties: {col_widths: '{"DNVTRP":25,"HCAMCK":17,"KLWBCE":20,"FKQVVU":40}', role: outlined-card}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'HNEGBU,LNSUTP'}
      name: plt_forecast
      properties: {height: '420'}
      type: Plot
    layout_properties: {grid_position: 'SJQADP,AWWGUP'}
    name: oc_chart
    properties: {role: outlined-card}
    type: ColumnPanel
  - components:
    - components:
      - name: rp_monthly
        properties: {item_template: forecast_sku_detail.rp_monthly}
        type: RepeatingPanel
      layout_properties: {grid_position: 'OPWPNT,PYNQSD'}
      name: dg_monthly
      properties:
        columns:
        - {data_key: month, id: JKSDUP, title: Month, width: '160'}
        - {data_key: forecast, id: OJLQEN, title: Forecast, width: '160'}
        - {data_key: lower, id: HUTGLD, title: Lower, width: '150'}
        - {data_key: upper, id: WNXRHS, title: Forecast Upper, width: '150'}
        - {data_key: actual, id: HORYAD, title: Actual, width: '160'}
        - {data_key: variance, id: CPEQZU, title: Variance, width: '150'}
        role: tonal-data-grid
        rows_per_page: 30
      type: DataGrid
    layout_properties: {grid_position: 'GBBBHD,OWXQWB'}
    name: oc_grid
    properties: {role: outlined-card}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- layout_properties: {slot: left-nav}
  name: nav
  properties: {}
  type: form:NavSidebar
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
