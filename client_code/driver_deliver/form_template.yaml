components:
- components:
  - layout_properties: {grid_position: 'VSAHFU,TUXQKW'}
    name: lbl_header
    properties: {bold: true, role: title, text: Driver Delivery}
    type: Label
  - components:
    - layout_properties: {grid_position: 'TULUJR,XEXNVW'}
      name: lbl_home_title
      properties:
        bold: true
        role: title
        spacing:
          margin: ['0', null, '0', null]
          padding: ['4', null, '4', null]
        text: Trips awaiting delivery
      type: Label
    - layout_properties: {grid_position: 'CWHHBI,YBAZCN'}
      name: lbl_empty_state
      properties:
        italic: true
        spacing:
          margin: ['0', null, '0', null]
          padding: ['4', null, '4', null]
        text: No trips awaiting delivery
        visible: false
      type: Label
    - layout_properties: {grid_position: 'RDCFAD,XIJGGT'}
      name: rp_trips
      properties: {item_template: driver_deliver.TripRowTemplate}
      type: RepeatingPanel
    - layout_properties: {grid_position: 'ZBJULU,THNOOH'}
      name: btn_home
      properties: {align: left, icon: 'fa:home', role: outlined-button, text: Home}
      type: Button
    - layout_properties: {grid_position: 'ZBJULU,DURLHN'}
      name: btn_refresh
      properties: {align: right, icon: 'fa:refresh', role: outlined-button, text: Refresh}
      type: Button
    layout_properties: {grid_position: 'HSHXEZ,WINQXU'}
    name: cp_home
    properties: {role: outlined-card}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'KLDWFR,AWUOFK'}
      name: lbl_confirm_title
      properties:
        bold: true
        spacing:
          margin: ['0', null, '0', null]
      type: Label
    - layout_properties: {grid_position: 'VDWOXD,WUMWYR'}
      name: lbl_confirm_sub
      properties:
        spacing:
          margin: ['0', null, '0', null]
        text: "Adjust delivered quantity if different from planned. \nAdd a note for any discrepancy."
      type: Label
    - layout_properties: {grid_position: 'IXYMWI,TGIFIQ'}
      name: rp_lines
      properties: {item_template: driver_deliver.SkuLineTemplate}
      type: RepeatingPanel
    - layout_properties: {grid_position: 'FZEERU,UJJZFW'}
      name: lbl_confirm_empty
      properties:
        bold: true
        italic: true
        spacing:
          margin: ['0', null, '0', null]
        visible: false
      type: Label
    - layout_properties: {grid_position: 'HPMBDO,CPANVD'}
      name: lbl_driver_name_prompt
      properties:
        role: input-prompt
        spacing:
          margin: ['0', null, '0', null]
        text: Driver name (optional)
      type: Label
    - layout_properties: {grid_position: 'IWUELA,GCHHSV'}
      name: txt_driver_name
      properties: {placeholder: Optional}
      type: TextBox
    - components:
      - layout_properties: {}
        name: btn_back
        properties: {icon: 'fa:backward', role: outlined-button, text: Back}
        type: Button
      - layout_properties: {}
        name: btn_submit
        properties: {icon: 'fa:bolt', role: outlined-button, text: Confirm Delivery}
        type: Button
      layout_properties: {grid_position: 'QGDEOH,HWPJHX'}
      name: fp_buttons
      properties: {align: justify}
      type: FlowPanel
    layout_properties: {grid_position: 'UWSKLI,GWOEHJ'}
    name: cp_confirm
    properties: {role: outlined-card, visible: false}
    type: ColumnPanel
  - components:
    - layout_properties: {grid_position: 'NVQTHR,HLXHJV'}
      name: lbl_success_headline
      properties:
        bold: true
        role: title
        spacing:
          margin: ['0', null, '0', null]
        text: Delivery recorded
      type: Label
    - layout_properties: {grid_position: 'QCFKVI,HGHQMS'}
      name: lbl_success_detail
      properties: {}
      type: Label
    - layout_properties: {grid_position: 'KMTVSM,DWQYFA'}
      name: btn_deliver_another
      properties: {align: left, role: outlined-button, text: Deliver Another}
      type: Button
    layout_properties: {grid_position: 'XECQNO,PSJHKU'}
    name: cp_success
    properties: {role: outlined-card, visible: false}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
